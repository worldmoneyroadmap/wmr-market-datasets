# Weekly refresh: copy the public CSV files served on worldmoneyroadmap.com into data/.
# No secrets or personal tokens: it reads public URLs and commits with the built-in GITHUB_TOKEN.
# scripts/update.py refuses to write anything if a check fails (header, row count, size,
# Korean text in the English edition, forbidden sources, rows falling by more than 30%).
name: Weekly data update

on:
  schedule:
    - cron: "17 1 * * 6"   # Saturday 01:17 UTC, after the U.S. Friday close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and check files from worldmoneyroadmap.com
        run: python3 scripts/update.py

      - name: Re-check what was written
        run: python3 scripts/update.py --check

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          git commit -m "data: weekly refresh from worldmoneyroadmap.com ($(date -u +%Y-%m-%d))"
          git push
